[project]
name = "proyecto6-grupo3"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "jupytext>=1.19.5",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "protobuf>=7.35.1",
    "pydantic-settings>=2.14.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "uvicorn[standard]>=0.51.0",
]

# Only used by models/04_deberta.py (training/comparison, not part of the
# deployed backend). Kept out of the base install so Render's build doesn't
# pull ~1GB of torch/transformers for a path that never runs in production —
# the previous local-translation engine loading these at runtime is what
# OOM-crashed the free-tier instance (see backend/app/translation.py).
# Install locally with: uv sync --extra training
[project.optional-dependencies]
training = [
    "accelerate>=1.1.0",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]
