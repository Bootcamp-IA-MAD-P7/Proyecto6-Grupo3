<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  
  <!-- Contenedor con borde transparente y efecto glassmorphism -->
  <div class="main-container">
    
    <!-- Barra Superior: Semáforo (luz única) y Estado -->
    <div class="mac-title-bar">
      <div class="semaforo-container">
        <!-- Por defecto solo se activa una (yellow en este ejemplo inicial) -->
        <span id="luzRed" class="luz red disabled" title="Riesgo Alto"></span>
        <span id="luzYellow" class="luz yellow active" title="Riesgo Medio"></span>
        <span id="luzGreen" class="luz green disabled" title="Riesgo Bajo / Seguro"></span>
      </div>
      
      <div id="statusBadge" class="status-badge">
        <span id="statusText" class="status-text"></span>
      </div>
    </div>

    <!-- Sección de Información del Sitio -->
    <div class="site-header-centered">
      <h1 class="extension-name">PrivacyLens</h1>
      
      <div class="logo-wrapper">
        <img id="siteAvatar" class="avatar-logo" src="fazt.png" alt="Logo del sitio">
      </div>
      
      <div class="site-details-centered">
        <h2 id="siteTitle" class="site-title"></h2>
        <a id="siteUrl" href="#" target="_blank" class="site-url"></a>
      </div>
    </div>

    <!-- Resumen de IA -->
    <div id="iaSummaryBox" class="ia-summary-box risk-low">
      <div class="summary-header-row">
        <span class="summary-label">RESUMEN DE LA IA</span>
        <span id="exposureScore" class="exposure-score"></span>
      </div>
      <p id="summaryContent" class="summary-content">
       ....
      </p>
      <p id="disclaimerText" class="disclaimer-text"></p>
    </div>

    <!-- Categorías Detectadas -->
    <div id="categoriesContainer" class="categories-container-styled">
      <span class="tag-category-styled tag-darkblue"><span class="dot-styled"></span></span>
      <span class="tag-category-styled tag-green"><span class="dot-styled"></span></span>
      <span class="tag-category-styled tag-lightpurple"><span class="dot-styled"></span></span>
      <span class="tag-category-styled tag-yellow"><span class="dot-styled"></span></span>
    </div>

    <!-- Evidencia del Documento -->
    <div class="evidence-box-styled">
      <span class="evidence-label-styled">EVIDENCIA DEL DOCUMENTO</span>
      <p id="evidenceQuote" class="evidence-quote-styled">"We share information with third-party service providers..."</p>
      <div class="evidence-subtext-styled">
        <span id="evidenceSection" class="evidence-section-text">Apartado 4.2</span> · 
        <a id="evidenceLink" href="#" class="evidence-link-styled">Ver en el documento →</a>
      </div>
    </div>

    <button id="retryBtn" class="retry-btn" style="display:none;">Reintentar análisis</button>

  </div>

  <script src="popup.js"></script>
</body>
</html>
